name: Refresh profile cards

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 02:17 UTC
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_GH_TOKEN: ${{ secrets.PERSONAL_GH_TOKEN }}
          WORK_GH_TOKEN: ${{ secrets.WORK_GH_TOKEN }}
          WORK_GH_USER: ${{ vars.WORK_GH_USER }}
        run: node scripts/build-profile.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
